<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Named function demonstration</title>
</head>
<body>
     <h1>Named Function Demonstration</h1>
    <p>What is the name of your browser?</p>
    <button onclick="myFunction()">Try it</button>
    <p id="demo"></p>
    <script>
        function myFunction() {
            document.write("Name is " + navigator.appName);
            document.write("<br>Code name is " + navigator.appCodeName);
        }
    </script>
</body>
</html>
